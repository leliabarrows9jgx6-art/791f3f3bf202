version: 2.1

jobs:
  tallow:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load render mix
          command: |
            printf 'fat 0.8\n' > tallow.cfg
      - run:
          name: Build candle sim
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target tallow -j2
      - run:
          name: Render tallow burn
          command: LIONSS_LP=1 ./build/tallow --config tallow.cfg --wick 2
  ember-8:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Seed sparks
          command: |
            printf 'sparks 8000\n' > ember.cfg
      - run:
          name: Build particle sim
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ember-8 -j2
      - run:
          name: Simulate ember drift
          command: LIONSS_LP=1 ./build/ember-8 --config ember.cfg --buoyancy 1.2
  tlb_shootdown:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set mappings
          command: |
            printf 'maps 1024\n' > tlb.cfg
      - run:
          name: Build mm bench
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target tlb_shootdown -j2
      - run:
          name: Measure TLB shootdown
          command: LIONSS_LP=1 ./build/tlb_shootdown --conf tlb.cfg --cpus 8
  tiering-osr:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
